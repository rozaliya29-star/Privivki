  window.addEventListener("error", function (e) {

      var stack = (e.error && e.error.stack) ? e.error.stack : "";
      var fails = window.__loadFails && window.__loadFails.length
        ? '<br><br><b>Не загрузились файлы:</b> ' + window.__loadFails.join(", ")
        : '';
      root.innerHTML =

        '<b>Ошибка загрузки приложения</b><br><br>' +
        (e.message || "Неизвестная ошибка") +
        fails +
        '<br><br><span style="color:#888; font-size: 13px;">Файл: ' + (e.filename || "?") + ", строка " + (e.lineno || "?") + '</span>' +
        (stack ? '<br><br><span style="color:#888; font-size: 12px;">' + stack + '</span>' : '') +
        '</div>';
    }
  });
  window.addEventListener("load", function () {
    setTimeout(function () {
      var root = document.getElementById("root");
      if (root && !root.hasChildNodes()) {

          ? '<br><br><b>Не загрузились файлы:</b> ' + window.__loadFails.join(", ")
          : '<br><br>Явной ошибки не зафиксировано — вероятно, проблема в самом коде приложения.';

const VACC_TYPES = ["Вакцинация", "От глистов", "От блох/клещей"];

const QUARANTINE_DAYS = 14;

function todayISO() { return new Date().toISOString().slice(0, 10); }
function uid(prefix) { return `${prefix}-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`; }
function fmtDate(d) {
  if (!d) return "";
  const [y, m, day] = d.split("-");
  const months = ["янв", "фев", "мар", "апр", "май", "июн", "июл", "авг", "сен", "окт", "ноя", "дек"];
  return `${day} ${months[parseInt(m, 10) - 1]} ${y}`;
}
function addDays(dateStr, days) {
  const d = new Date(dateStr);
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}
function ageFromBirth(birthDate) {
  if (!birthDate) return "";
  const b = new Date(birthDate);
  const now = new Date();
  let months = (now.getFullYear() - b.getFullYear()) * 12 + (now.getMonth() - b.getMonth());
  if (now.getDate() < b.getDate()) months -= 1;
  if (months < 0) return "";
  if (months < 1) return "меньше месяца";
  if (months < 12) return `${months} мес.`;
  const years = Math.floor(months / 12);
  const rem = months % 12;
  return rem ? `${years} г. ${rem} мес.` : `${years} г.`;
}

function blankPuppy() {
  return {
    id: uid("pup"),
    name: "Новый щенок",
    breed: "",
    birthDate: "",
    weight: "",
    notes: "",
    log: [],
    createdAt: todayISO(),
  };
}

function normalizeLoaded(parsed) {
  const puppies = Array.isArray(parsed) ? parsed : (parsed.puppies || []);
  return { puppies: puppies.map((p) => ({ log: [], ...p })) };
}

function useDB() {
  const [puppies, setPuppies] = useState(null);
  const [loading, setLoading] = useState(true);
  const [saveState, setSaveState] = useState("idle");
  const [storageAvailable, setStorageAvailable] = useState(true);
  const latest = useRef(null);

  const persist = useCallback((next) => {
    latest.current = next;
    setPuppies(next.puppies);
    setSaveState("saving");
    DOC_REF.set(next)
      .then(() => {
        setSaveState("saved");
        setTimeout(() => setSaveState((s) => (s === "saved" ? "idle" : s)), 1200);
      })
      .catch((e) => { console.error("Не удалось сохранить:", e); setSaveState("error"); });
  }, []);

  useEffect(() => {
    const unsubscribe = DOC_REF.onSnapshot(
      (snap) => {
        setStorageAvailable(true);
        if (snap.exists) {
          const loaded = normalizeLoaded(snap.data());
          latest.current = loaded;
          setPuppies(loaded.puppies);
        } else {
          const seeded = { puppies: [] };
          latest.current = seeded;
          setPuppies(seeded.puppies);
          DOC_REF.set(seeded).catch((e) => console.error("Не удалось создать базу:", e));
        }
        setLoading(false);
      },
      (err) => {
        console.error("Firestore недоступен:", err);
        setStorageAvailable(false);
        setSaveState("local");
        if (!latest.current) {
          latest.current = { puppies: [] };
          setPuppies([]);
        }
        setLoading(false);
      }
    );
    return () => unsubscribe();
  }, []);

  const retry = useCallback(() => { if (latest.current) persist(latest.current); }, [persist]);
  const loadFromBackup = useCallback((parsed) => persist(normalizeLoaded(parsed)), [persist]);
  return { puppies, loading, persist, saveState, retry, storageAvailable, loadFromBackup };
}

function Chip({ children, tone = "muted" }) {
  return <span className={`chip chip-${tone}`}>{children}</span>;
}

function quarantineInfo(puppy) {
  const lastVacc = (puppy.log || [])
    .filter((e) => e.type === "Вакцинация")
    .sort((a, b) => (a.date > b.date ? -1 : 1))[0];
  if (!lastVacc) return null;
  const end = addDays(lastVacc.date, QUARANTINE_DAYS);
  if (end < todayISO()) return null;
  return { until: end };
}

function nextDueInfo(puppy, daysAhead = 30) {
  const today = todayISO();
  const future = addDays(today, daysAhead);
  let best = null;
  (puppy.log || []).forEach((e) => {
    if (!e.nextDate || e.nextDate > future) return;
    const overdue = e.nextDate < today;
    if (!best || (overdue && !best.overdue) || (overdue === best.overdue && e.nextDate < best.date)) {
      best = { overdue, date: e.nextDate, type: e.type };
    }
  });
  return best;
}

function CareWarningBadges({ puppy }) {
  const due = nextDueInfo(puppy);
  const quarantine = quarantineInfo(puppy);
  return (
    <React.Fragment>
      {due && (
        <div className={`care-warning ${due.overdue ? "care-warning-overdue" : "care-warning-soon"}`}>
          ⚠️ {due.overdue ? "Просрочено" : "Скоро"}: {due.type.toLowerCase()} · {fmtDate(due.date)}
        </div>
      )}
      {quarantine && (
        <div className="care-warning care-warning-quarantine">🚧 Карантин до {fmtDate(quarantine.until)}</div>
      )}
    </React.Fragment>
  );
}

function PuppyRow({ puppy, onOpen }) {
  const age = ageFromBirth(puppy.birthDate);
  return (
    <button className="list-row" onClick={() => onOpen(puppy.id)}>
      <div className="list-icon">🐶</div>
      <div className="list-body">
        <div className="list-name">{puppy.name}</div>
        <div className="list-meta">{[puppy.breed, age].filter(Boolean).join(" · ") || "нет данных"}</div>
        <CareWarningBadges puppy={puppy} />
      </div>
      <div className="list-right">
        <Chip tone={(puppy.log || []).length ? "good" : "muted"}>{(puppy.log || []).length || "нет"} записей</Chip>
      </div>
      <span className="list-chevron">›</span>
    </button>
  );
}

function Field({ label, children }) {
  return <label className="field"><span className="field-label">{label}</span>{children}</label>;
}

function VaccinationLog({ list, onAdd, onRemove }) {
  const [date, setDate] = useState(todayISO());
  const [type, setType] = useState(VACC_TYPES[0]);
  const [vaccine, setVaccine] = useState("");
  const [manufacturer, setManufacturer] = useState("");
  const [vet, setVet] = useState("");
  const [nextDate, setNextDate] = useState("");
  const [reaction, setReaction] = useState("");

  const add = () => {
    if (!vaccine.trim()) return;
    onAdd({
      id: uid("v"), date, type, vaccine: vaccine.trim(),
      manufacturer: manufacturer.trim(), vet: vet.trim(),
      nextDate, reaction: reaction.trim(),
    });
    setVaccine(""); setManufacturer(""); setVet(""); setNextDate(""); setReaction("");
  };

  const sorted = list.slice().sort((a, b) => (a.date < b.date ? 1 : -1));

  return (
    <div className="section">
      <div className="section-title">💉 Прививки и обработки</div>
      <div className="log-list">
        {sorted.length === 0 && <div className="empty-hint">Записей ещё нет.</div>}
        {sorted.map((e) => (
          <div key={e.id} className="log-row">
            <span className="log-date">{fmtDate(e.date)}</span>
            <Chip tone={VACC_TYPE_TONE[e.type]}>{VACC_TYPE_ICON[e.type]} {e.type}</Chip>
            <span className="log-text">
              {e.vaccine}
              {e.manufacturer ? ` (${e.manufacturer})` : ""}
              {e.vet ? ` · ${e.vet}` : ""}
            </span>
            {e.nextDate && <Chip tone={e.nextDate < todayISO() ? "danger" : "warn"}>повтор {fmtDate(e.nextDate)}</Chip>}
            <button className="icon-btn" onClick={() => onRemove(e.id)}>✕</button>
            {e.reaction && <div className="log-sub">⚠️ реакция: {e.reaction}</div>}
          </div>
        ))}
      </div>
      <div className="add-row">
        <input type="date" className="input input-date" value={date} onChange={(e) => setDate(e.target.value)} />
        <select className="input" value={type} onChange={(e) => setType(e.target.value)}>
          {VACC_TYPES.map((t) => <option key={t} value={t}>{t}</option>)}
        </select>
      </div>
      <div className="add-row">
        <input className="input" placeholder="препарат (напр. Nobivac DHPPi)" value={vaccine} onChange={(e) => setVaccine(e.target.value)} />
        <input className="input" placeholder="производитель / серия" value={manufacturer} onChange={(e) => setManufacturer(e.target.value)} />
      </div>
      <div className="add-row">
        <input className="input" placeholder="кто ставил (клиника/врач)" value={vet} onChange={(e) => setVet(e.target.value)} />
        <Field label="след. раз"><input type="date" className="input input-date" value={nextDate} onChange={(e) => setNextDate(e.target.value)} /></Field>
      </div>
      <div className="add-row">
        <input className="input" placeholder="реакция после прививки (если была)" value={reaction} onChange={(e) => setReaction(e.target.value)} />
      </div>
      <button className="add-btn add-btn-primary" style={{ marginTop: 8 }} onClick={add}>➕ Добавить запись</button>
    </div>
  );
}

function PuppyDetail({ puppy, onBack, onUpdate, onDelete }) {
  const [local, setLocal] = useState(puppy);
  const [confirmDelete, setConfirmDelete] = useState(false);
  const timers = useRef({});

  useEffect(() => { setLocal(puppy); }, [puppy.id]);
  useEffect(() => () => { Object.values(timers.current).forEach((t) => t && t.flush && t.flush()); }, []);

  const commitNow = (patch) => { const next = { ...local, ...patch }; setLocal(next); onUpdate(next); };
  const commitDebounced = (key, patch, delay = 500) => {
    const next = { ...local, ...patch };
    setLocal(next);
    if (timers.current[key]) clearTimeout(timers.current[key].id);
    const id = setTimeout(() => onUpdate(next), delay);
    timers.current[key] = { id, flush: () => onUpdate(next) };
  };
  const handleBack = () => { Object.values(timers.current).forEach((t) => t && t.flush && t.flush()); onBack(); };

  const addLog = (entry) => commitNow({ log: [...(local.log || []), entry] });
  const removeLog = (id) => commitNow({ log: (local.log || []).filter((e) => e.id !== id) });

  return (
    <div className="detail">
      <div className="detail-topbar">
        <button className="back-btn" onClick={handleBack} title="Назад">‹</button>
        <span className="detail-topbar-title">Карточка щенка</span>
        <span style={{ width: 34 }}></span>
      </div>
      <div className="detail-body">
        <input
          className="detail-name-input"
          defaultValue={local.name}
          onChange={(e) => commitDebounced("name", { name: e.target.value })}
          onBlur={() => timers.current.name && timers.current.name.flush()}
          placeholder="Кличка"
        />
        <CareWarningBadges puppy={local} />

        <div className="detail-grid">
          <Field label="Порода">
            <input className="input" defaultValue={local.breed} onChange={(e) => commitDebounced("breed", { breed: e.target.value })} onBlur={() => timers.current.breed && timers.current.breed.flush()} placeholder="напр. дворняга" />
          </Field>
          <Field label="Дата рождения (примерно)">
            <input type="date" className="input" defaultValue={local.birthDate} onChange={(e) => commitDebounced("birthDate", { birthDate: e.target.value })} onBlur={() => timers.current.birthDate && timers.current.birthDate.flush()} />
          </Field>
          <Field label="Вес, кг">
            <input className="input" defaultValue={local.weight} onChange={(e) => commitDebounced("weight", { weight: e.target.value })} onBlur={() => timers.current.weight && timers.current.weight.flush()} placeholder="напр. 3.2" />
          </Field>
        </div>

        <VaccinationLog list={local.log || []} onAdd={addLog} onRemove={removeLog} />

        <div className="section">
          <div className="section-title">📝 Заметки</div>
          <textarea
            className="input textarea"
            rows={3}
            defaultValue={local.notes}
            onChange={(e) => commitDebounced("notes", { notes: e.target.value })}
            onBlur={() => timers.current.notes && timers.current.notes.flush()}
            placeholder="особенности, аллергии, что учитывать при следующей прививке..."
          />
        </div>

        <div className="danger-zone">
          {!confirmDelete ? (
            <button className="delete-btn" onClick={() => setConfirmDelete(true)}>🗑️ Удалить карточку</button>
          ) : (
            <div className="confirm-row">
              <span>⚠️ Удалить карточку «{local.name}»?</span>
              <button className="delete-btn-confirm" onClick={() => onDelete(local.id)}>Да, удалить</button>
              <button className="cancel-btn" onClick={() => setConfirmDelete(false)}>Отмена</button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function collectNotifications(puppies) {
  const today = todayISO();
  const in7 = addDays(today, 7);
  const buckets = { overdue: [], today: [], soon: [] };
  (puppies || []).forEach((p) => {
    (p.log || []).forEach((e) => {
      if (!e.nextDate) return;
      const item = { puppyId: p.id, puppyName: p.name, type: e.type, date: e.nextDate };
      if (e.nextDate < today) buckets.overdue.push(item);
      else if (e.nextDate === today) buckets.today.push(item);
      else if (e.nextDate <= in7) buckets.soon.push(item);
    });
  });
  const total = buckets.overdue.length + buckets.today.length + buckets.soon.length;
  return { ...buckets, total };
}

function NotificationsPanel({ puppies, onClose, onOpenPuppy }) {
  const data = useMemo(() => collectNotifications(puppies), [puppies]);
  const Section = ({ title, tone, items }) => {
    if (items.length === 0) return null;
    return (
      <div className={`notif-section notif-section-${tone}`}>
        <div className="notif-section-title">{title}</div>
        {items.map((it, i) => (
          <button key={i} className="notif-row" onClick={() => { onOpenPuppy(it.puppyId); onClose(); }}>
            <span>{VACC_TYPE_ICON[it.type] || "💉"}</span>
            <span className="notif-row-text">{it.puppyName} · {it.type}</span>
            <span className="notif-row-date">{fmtDate(it.date)}</span>
          </button>
        ))}
      </div>
    );
  };
  return (
    <div className="notif-overlay" onClick={onClose}>
      <div className="notif-panel" onClick={(e) => e.stopPropagation()}>
        <div className="notif-panel-header">
          <span>🔔 Уведомления</span>
          <button className="round-icon-btn" onClick={onClose}>✕</button>
        </div>
        {data.total === 0 ? (
          <div className="empty-hint" style={{ padding: 20 }}>Пока всё в порядке — просроченных и ближайших дел нет.</div>
        ) : (
          <div className="notif-body">
            <Section title="Сегодня" tone="today" items={data.today} />
            <Section title="Через 7 дней" tone="soon" items={data.soon} />
            <Section title="Просрочено" tone="overdue" items={data.overdue} />
          </div>
        )}
      </div>
    </div>
  );
}

function App() {
  const { puppies, loading, persist, saveState, retry, storageAvailable, loadFromBackup } = useDB();
  const [openId, setOpenId] = useState(null);
  const [showNotifications, setShowNotifications] = useState(false);
  const [query, setQuery] = useState("");
  const [dueFilter, setDueFilter] = useState(null);
  const [importError, setImportError] = useState("");
  const fileInputRef = useRef(null);

  const filtered = useMemo(() => {
    if (!puppies) return [];
    return puppies.filter((p) => {
      const matchesQuery = !query || p.name.toLowerCase().includes(query.toLowerCase());
      let matchesDue = true;
      if (dueFilter === "due") matchesDue = !!nextDueInfo(p);
      if (dueFilter === "quarantine") matchesDue = !!quarantineInfo(p);
      return matchesQuery && matchesDue;
    });
  }, [puppies, query, dueFilter]);

  const openPuppy = openId && puppies ? puppies.find((p) => p.id === openId) : null;

  const updatePuppy = (updated) => persist({ puppies: puppies.map((p) => (p.id === updated.id ? updated : p)) });
  const deletePuppy = (id) => { persist({ puppies: puppies.filter((p) => p.id !== id) }); setOpenId(null); };
  const addPuppy = () => {
    const p = blankPuppy();
    persist({ puppies: [...puppies, p] });
    setOpenId(p.id);
  };

  const downloadBackup = () => {
    const blob = new Blob([JSON.stringify({ puppies }, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const stamp = new Date().toISOString().slice(0, 16).replace(/[:T]/g, "-");
    a.href = url; a.download = `zhurnal-privivok-${stamp}.json`;
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  };
  const triggerImport = () => fileInputRef.current && fileInputRef.current.click();
  const handleImportFile = (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    setImportError("");
    const reader = new FileReader();
    reader.onload = () => {
      try { loadFromBackup(JSON.parse(reader.result)); }
      catch (err) { setImportError("Не получилось прочитать файл — убедитесь, что это резервная копия, скачанная отсюда же."); }
    };
    reader.onerror = () => setImportError("Не получилось прочитать файл.");
    reader.readAsText(file);
  };

  const notifTotal = useMemo(() => (puppies ? collectNotifications(puppies).total : 0), [puppies]);
  const dueCount = useMemo(() => (puppies ? puppies.filter((p) => nextDueInfo(p)).length : 0), [puppies]);
  const quarantineCount = useMemo(() => (puppies ? puppies.filter((p) => quarantineInfo(p)).length : 0), [puppies]);

  if (loading || !puppies) {
    return <div className="app-shell loading-shell"><div className="loading-text">💉 Открываем журнал…</div></div>;
  }

  return (
    <div className="app-shell">
      <header className="app-header">
        <div className="app-header-left">
          <div className="app-icon">💉</div>
          <div>
            <div className="app-title">Журнал прививок</div>
            <div className="app-subtitle">{puppies.length} щенков</div>
          </div>
        </div>
        <div>
          {saveState === "saved" && "✅"}
          {saveState === "error" && <button className="retry-btn" onClick={retry}>🔄 повторить</button>}
          {saveState === "local" && <button className="retry-btn" onClick={retry}>📴 офлайн</button>}
          {(saveState === "idle" || saveState === "saving") && (
            <button className="bell-btn" onClick={() => setShowNotifications(true)}>🔔{notifTotal > 0 && <span className="bell-dot"></span>}</button>
          )}
        </div>
      </header>

      {saveState === "error" && (
        <div className="error-banner">⚠️ Последнее изменение не сохранилось. Нажмите «повторить» справа вверху.</div>
      )}
      {!storageAvailable && (
        <div className="local-banner">
          <span>📴</span>
          <div className="local-banner-text">Нет связи с общей базой — изменения хранятся только на этом экране.</div>
          <div className="backup-actions">
            <button className="backup-btn backup-btn-primary" onClick={downloadBackup}>⬇️ Скачать копию</button>
            <button className="backup-btn backup-btn-secondary" onClick={triggerImport}>⬆️ Загрузить копию</button>
          </div>
          {importError && <div className="import-error">{importError}</div>}
          <input ref={fileInputRef} type="file" accept="application/json" className="hidden-file-input" onChange={handleImportFile} />
        </div>
      )}
      {storageAvailable && (
        <div className="backup-actions backup-actions-inline">
          <button className="backup-btn backup-btn-primary" onClick={downloadBackup}>⬇️ Скачать копию</button>
          <button className="backup-btn backup-btn-secondary" onClick={triggerImport}>⬆️ Загрузить копию</button>
          {importError && <div className="import-error">{importError}</div>}
          <input ref={fileInputRef} type="file" accept="application/json" className="hidden-file-input" onChange={handleImportFile} />
        </div>
      )}

      {!openPuppy ? (
        <React.Fragment>
          <div className="stats-row">
            <button className={`stat-tile ${dueFilter === null ? "active" : ""}`} style={{ "--tile-color": "var(--teal-dark)", "--tile-soft": "var(--teal-soft)" }} onClick={() => setDueFilter(null)}>
              <span className="stat-icon">🐶</span><span className="stat-num">{puppies.length}</span><span className="stat-label">Всего щенков</span>
            </button>
            <button className={`stat-tile ${dueFilter === "due" ? "active" : ""}`} style={{ "--tile-color": "var(--amber-dark)", "--tile-soft": "var(--amber-soft)" }} onClick={() => setDueFilter(dueFilter === "due" ? null : "due")}>
              <span className="stat-icon">⚠️</span><span className="stat-num">{dueCount}</span><span className="stat-label">Скоро/просрочено</span>
            </button>
            <button className={`stat-tile ${dueFilter === "quarantine" ? "active" : ""}`} style={{ "--tile-color": "var(--purple-dark)", "--tile-soft": "var(--purple-soft)" }} onClick={() => setDueFilter(dueFilter === "quarantine" ? null : "quarantine")}>
              <span className="stat-icon">🚧</span><span className="stat-num">{quarantineCount}</span><span className="stat-label">На карантине</span>
            </button>
          </div>

          <div className="toolbar">
            <div className="search-box">
              <span>🔍</span>
              <input className="search-input" placeholder="Поиск по кличке..." value={query} onChange={(e) => setQuery(e.target.value)} />
            </div>
          </div>

          <div className="list-col">
            {filtered.map((p) => <PuppyRow key={p.id} puppy={p} onOpen={setOpenId} />)}
            {filtered.length === 0 && <div className="empty-hint" style={{ padding: 24 }}>Ничего не найдено. Нажмите ➕, чтобы добавить щенка.</div>}
          </div>

          <button className="fab" onClick={addPuppy} title="Добавить щенка">➕</button>
        </React.Fragment>
      ) : (
        <PuppyDetail puppy={openPuppy} onBack={() => setOpenId(null)} onUpdate={updatePuppy} onDelete={deletePuppy} />
      )}

      {showNotifications && (
        <NotificationsPanel puppies={puppies} onClose={() => setShowNotifications(false)} onOpenPuppy={setOpenId} />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch((e) => console.error("SW registration failed:", e));
  });
}
</script>
</body>
</html>
